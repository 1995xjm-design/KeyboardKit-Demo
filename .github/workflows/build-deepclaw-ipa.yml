name: Build unsigned OpenClaw iOS IPA

# Trigger: edit this file or run workflow_dispatch (Actions tab).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-deepclaw-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Clone DeepClaw source
        run: git clone --depth 1 https://github.com/deepgram/dglabs-deepclaw.git DeepClaw

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen / SwiftLint / SwiftFormat
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate iOS project
        working-directory: DeepClaw/apps/ios
        run: xcodegen generate

      - name: Build archive (unsigned, Release)
        working-directory: DeepClaw/apps/ios
        run: |
          xcodebuild archive \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/OpenClaw.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: DeepClaw/apps/ios
        run: |
          mkdir -p build/ipa
          cd build/OpenClaw.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../ipa/OpenClaw.ipa Payload
          ls -lh ../../../ipa/

      - name: Commit IPA back to CI repo
        run: |
          mkdir -p dist
          cp DeepClaw/apps/ios/build/ipa/OpenClaw.ipa dist/
          git config user.name "CI Bot"
          git config user.email "actions@github.com"
          git add dist/OpenClaw.ipa
          git commit -m "build: OpenClaw unsigned IPA [skip ci]" || echo "no changes"
          git push

      - name: Upload artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-iOS-unsigned
          path: DeepClaw/apps/ios/build/ipa/OpenClaw.ipa
          retention-days: 7
