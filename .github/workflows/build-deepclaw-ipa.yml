name: Build unsigned OpenClaw iOS IPA (official + zh lang picker)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-deepclaw-ipa.yml'
      - 'zh-files/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Clone official OpenClaw source
        run: |
          # Pin to ab5b8b9a (2026-08-16): latest upstream main at integration time.
          # Our zh/EdgeTTS/language patches are built on this exact commit.
          git clone https://github.com/openclaw/openclaw.git OpenClaw
          cd OpenClaw && git checkout ab5b8b9a && git log --oneline -1

      - name: Generate Version.xcconfig
        working-directory: OpenClaw/apps/ios
        run: |
          mkdir -p build
          cat > build/Version.xcconfig <<'EOF'
          OPENCLAW_MARKETING_VERSION = 2026.8.0
          OPENCLAW_BUILD_VERSION = 1
          OPENCLAW_IOS_VERSION = 2026.8.0
          OPENCLAW_GIT_COMMIT = ci-build
          OPENCLAW_BUILD_TIMESTAMP = 2026-08-09T00:00:00Z
          EOF

      - name: Generate Swift sources filelist
        working-directory: OpenClaw/apps/ios
        run: find Sources ShareExtension ActivityWidget WatchApp -name '*.swift' -print | sort > SwiftSources.input.xcfilelist

      - name: Apply language-picker files
        working-directory: OpenClaw
        run: |
          cp -R ../zh-files/apps/ios/* apps/ios/
          test -f apps/ios/Sources/Design/AppLanguagePreference.swift
          grep -q "Restart the app to apply the language change" apps/ios/Sources/Design/SettingsProTabSections.swift
          grep -q "AppLanguagePreference.applySavedPreference" apps/ios/Sources/OpenClawApp.swift
          grep -c "zh-CN" apps/ios/Resources/Localizable.xcstrings

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install pinned Swift tools (official script)
        working-directory: OpenClaw
        run: |
          ./scripts/install-swift-tools.sh .build/swift-tools
          .build/swift-tools/swiftformat --version
          .build/swift-tools/swiftlint version

      - name: Auto-format with SwiftFormat (official config)
        working-directory: OpenClaw/apps/ios
        run: |
          export PATH="$(pwd)/../../.build/swift-tools:$PATH"
          # Fix formatting so the official SwiftFormat lint phase (error-level) passes.
          # Our zh/EdgeTTS edits are wrapped/line-broken here; official lint would otherwise fail.
          swiftformat --config "$PWD/../../config/swiftformat" \
            --unexclude "$PWD/Sources" \
            --filelist "$PWD/SwiftSources.input.xcfilelist" || echo "swiftformat fix had warnings (continuing)"
          # Verify the files no longer fail lint before archiving
          swiftformat --lint --config "$PWD/../../config/swiftformat" \
            --unexclude "$PWD/Sources" \
            --filelist "$PWD/SwiftSources.input.xcfilelist"

      - name: Generate iOS project
        working-directory: OpenClaw/apps/ios
        run: xcodegen generate

      - name: Build archive (unsigned, Release)
        working-directory: OpenClaw/apps/ios
        run: |
          export PATH="$(pwd)/../../.build/swift-tools:$PATH"
          set +e
          xcodebuild archive \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenClaw.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== ERROR LINES ==="
            grep -E "error:|The following build commands failed|fatal error|Command .* failed" build/xcodebuild.log | head -n 40
            echo "=== TAIL ==="
            tail -n 50 build/xcodebuild.log
            {
              grep -E "error:|The following build commands failed|fatal error|Command .* failed" build/xcodebuild.log | head -n 40
              echo "--- tail ---"
              tail -n 50 build/xcodebuild.log
            } | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/:/%3A/g; s/,/%2C/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Package IPA
        working-directory: OpenClaw/apps/ios
        run: |
          mkdir -p build/ipa
          cd build/OpenClaw.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          # 免费签名 sideload 兼容：移除 Watch companion（避免 WKCompanionAppBundleIdentifier 校验失败）
          rm -rf Payload/OpenClaw.app/Watch
          # zh-Hans.lproj 补翻译（Xcode 只生成 zh-CN.lproj，简体中文系统按 zh-Hans 匹配会回退英文）
          cp Payload/OpenClaw.app/zh-CN.lproj/Localizable.strings Payload/OpenClaw.app/zh-Hans.lproj/Localizable.strings
          zip -r ../../../ipa/OpenClaw.ipa Payload
          ls -lh ../../../ipa/

      - name: Commit IPA back to CI repo
        run: |
          mkdir -p dist
          cp OpenClaw/apps/ios/build/ipa/OpenClaw.ipa dist/
          git config user.name "CI Bot"
          git config user.email "actions@github.com"
          # Robust merge: rebase when possible, otherwise reset to origin and re-add.
          git pull --rebase origin main || (git fetch origin main && git reset --hard origin/main)
          cp OpenClaw/apps/ios/build/ipa/OpenClaw.ipa dist/
          git add dist/OpenClaw.ipa
          git commit -m "build: OpenClaw official zh IPA [skip ci]" || echo "no changes"
          git push

      - name: Upload artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-iOS-zh-unsigned
          path: |
            OpenClaw/apps/ios/build/ipa/OpenClaw.ipa
            OpenClaw/apps/ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
