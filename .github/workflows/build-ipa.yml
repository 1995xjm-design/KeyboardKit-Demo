name: Build unsigned KeyboardKit Demo IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'Demo/**'
      - 'Package.swift'
      - 'Package.resolved'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve SPM dependencies
        run: xcodebuild -project Demo/Demo.xcodeproj -scheme Demo -resolvePackageDependencies

      - name: Build (unsigned, Release)
        run: |
          set +e
          xcodebuild -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              grep -E "error:|The following build commands failed|fatal error|Command .* failed" xcodebuild.log | head -n 40
              echo "--- tail ---"
              tail -n 50 xcodebuild.log
            } | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/:/%3A/g; s/,/%2C/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Demo.app" Payload/
          zip -r KeyboardKit-Demo.ipa Payload
          ls -lh KeyboardKit-Demo.ipa

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardKit-Demo-build
          path: |
            KeyboardKit-Demo.ipa
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
