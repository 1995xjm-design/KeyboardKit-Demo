name: Build unsigned KeyboardKit Demo IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'Demo/**'
      - 'Packages/**'
      - 'Frameworks/**'
      - 'Resources/**'
      - 'build-schemas.sh'
      - 'Package.swift'
      - 'Package.resolved'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rime frameworks
        run: |
          set -e
          mkdir -p Frameworks
          cd Frameworks
          BASE="https://github.com/zhanggenlove/LibrimeKit/releases/download/v0.1.0"
          for f in librime libopencc libleveldb libmarisa libyaml-cpp; do
            curl -fL -o "$f.xcframework.zip" "$BASE/$f.xcframework.zip"
            unzip -oq "$f.xcframework.zip"
            rm -f "$f.xcframework.zip"
          done
          ls -la

      - name: Build Rime schemas
        run: |
          set -e
          bash build-schemas.sh

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve SPM dependencies
        run: |
          set +e
          xcodebuild -project Demo/Demo.xcodeproj -scheme Demo -resolvePackageDependencies > resolve.log 2>&1
          status=$?
          cat resolve.log | tail -n 30
          if [ $status -ne 0 ]; then
            {
              grep -E "error:|failed|Could not|manifest|package|dependency|xcframework|binary" resolve.log | head -n 80
              echo "--- resolve.log tail ---"
              tail -n 60 resolve.log
            } | sed 's/%/%25/g; s//%0D/g; s/
/%0A/g; s/:/%3A/g; s/,/%2C/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Build (unsigned, Release)
        run: |
          set +e
          xcodebuild -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              grep -E "error:|Undefined symbols|duplicate symbol|ld: |Linker command|_OBJC_CLASS_|referenced from" xcodebuild.log | head -n 60
              echo "--- tail ---"
              tail -n 60 xcodebuild.log
            } | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/:/%3A/g; s/,/%2C/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Inject Chinese localization into KeyboardKit framework
        run: |
          python3 - <<'PYEOF'
          import os, plistlib
          framework = "build/Build/Products/Release-iphoneos/Demo.app/Frameworks/KeyboardKit.framework"
          lproj = os.path.join(framework, "zh-Hans.lproj")
          os.makedirs(lproj, exist_ok=True)
          data = {
              "space": "??",
              "return": "??",
              "done": "??",
              "capsLock": "????",
              "next": "???",
              "ok": "?",
              "search": "??",
              "send": "??",
              "continue": "??",
              "go": "??",
              "join": "??",
              "route": "??",
              "emergencyCall": "????",
              "locale": "??",
              "switcherAlphabetic": "ABC",
              "switcherNumeric": "123",
              "switcherSymbolic": "#+=",
              "searchEmoji": "????",
              "EmojiCategory.smileysAndPeople": "?????",
              "EmojiCategory.animalsAndNature": "?????",
              "EmojiCategory.foodAndDrink": "?????",
              "EmojiCategory.travelAndPlaces": "?????",
              "EmojiCategory.activity": "??",
              "EmojiCategory.objects": "??",
              "EmojiCategory.symbols": "??",
              "EmojiCategory.flags": "??",
              "EmojiCategory.favorites": "??",
              "EmojiCategory.frequent": "??",
              "EmojiCategory.recent": "????",
          }
          with open(os.path.join(lproj, "Localizable.strings"), "wb") as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          print("wrote", os.path.join(lproj, "Localizable.strings"), len(data), "keys")
          PYEOF
          ls -la "build/Build/Products/Release-iphoneos/Demo.app/Frameworks/KeyboardKit.framework/zh-Hans.lproj"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Demo.app" Payload/
          zip -r KeyboardKit-Demo.ipa Payload
          ls -lh KeyboardKit-Demo.ipa

      - name: Commit IPA back to CI repo
        run: |
          mkdir -p dist
          cp KeyboardKit-Demo.ipa dist/
          git config user.name "CI Bot"
          git config user.email "actions@github.com"
          git add dist/KeyboardKit-Demo.ipa
          git commit -m "build: KeyboardKit Demo zh IPA [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardKit-Demo-build
          path: |
            KeyboardKit-Demo.ipa
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
